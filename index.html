<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = "mahjong-app-local-v1";

const DEFAULT_SETTINGS = {
  startPoint: 25000,
  returnPoint: 30000,
  uma: [30, 10, -10, -30],
  chipRate: 1,
  chipBase: 20,
  players: ["プレイヤー1", "プレイヤー2", "プレイヤー3", "プレイヤー4"],
};

// ── Persistence (localStorage) ──
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error("Save failed", e); }
}

// ── 五捨六入 (round hundreds: ≤500 down, ≥600 up) ──
function roundScore(score) {
  const sign = score >= 0 ? 1 : -1;
  const abs = Math.abs(score);
  return sign * Math.floor((abs + 400) / 1000) * 1000;
}

// ── Point calculation with tied-rank splitting ──
function calcResult(scores, settings) {
  const { startPoint, returnPoint, uma } = settings;
  // オカ = (返し - 配給原点) × 4人分
  const oka = (returnPoint - startPoint) * 4;
  // 五捨六入を適用
  const rounded = scores.map(s => roundScore(s));
  const sorted = rounded
    .map((s, i) => ({ score: s, idx: i }))
    .sort((a, b) => b.score - a.score);

  const results = new Array(4).fill(0);
  let i = 0;
  while (i < 4) {
    let j = i;
    while (j < 4 && sorted[j].score === sorted[i].score) j++;
    const tiedCount = j - i;
    const avgUma = uma.slice(i, j).reduce((a, b) => a + b, 0) / tiedCount;
    const hasFirst = i === 0;
    const okaShare = hasFirst ? (oka / 1000) / tiedCount : 0;
    for (let k = i; k < j; k++) {
      const playerIdx = sorted[k].idx;
      const raw = (rounded[playerIdx] - returnPoint) / 1000;
      results[playerIdx] = raw + avgUma + okaShare;
    }
    i = j;
  }

  // 五捨六入の端数で合計が±0にならない場合、トップに寄せて調整
  const totalPt = Math.round(results.reduce((a, b) => a + b, 0) * 10) / 10;
  if (Math.abs(totalPt) > 0.001) {
    const topIdx = sorted[0].idx;
    results[topIdx] -= totalPt;
  }

  const ranks = sorted.map(s => s.idx);
  return { results, ranks };
}

        <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    ),
    plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>,
    trash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>,
    back: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6" /></svg>,
    edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>,
    chip: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9" /><text x="12" y="16" textAnchor="middle" fill="currentColor" fontSize="11" fontWeight="bold" stroke="none">¥</text></svg>,
    clear: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M5 6l1 14h12l1-14" /><line x1="9" y1="10" x2="9" y2="16" /><line x1="15" y1="10" x2="15" y2="16" /></svg>,
  };
  return icons[name] || null;
}

// ── Settings Screen ──
function SettingsScreen({ settings, onSave, onBack }) {
  const [local, setLocal] = useState({ ...settings });
  const updatePlayer = (i, v) => { const p = [...local.players]; p[i] = v; setLocal({ ...local, players: p }); };
  const updateUma = (i, v) => { const u = [...local.uma]; u[i] = parseFloat(v) || 0; setLocal({ ...local, uma: u }); };

  return (
    <div style={styles.screen}>
      <div style={styles.header}>
        <button style={styles.headerBtn} onClick={onBack}><Icon name="back" /></button>
        <h1 style={styles.headerTitle}>設定</h1>
        <button style={{ ...styles.headerBtn, ...styles.saveBtn }} onClick={() => onSave(local)}>保存</button>
      </div>
      <div style={styles.content}>
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>プレイヤー名</h3>
          {local.players.map((p, i) => (
            <div key={i} style={styles.inputRow}>
              <span style={styles.inputLabel}>{["東", "南", "西", "北"][i]}</span>
              <input style={styles.input} value={p} onChange={(e) => updatePlayer(i, e.target.value)} />
            </div>
          ))}
        </div>
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>ポイント計算</h3>
          <div style={styles.inputRow}>
            <span style={styles.inputLabel}>配給原点</span>
            <input style={styles.input} type="number" value={local.startPoint} onChange={(e) => setLocal({ ...local, startPoint: parseInt(e.target.value) || 0 })} />
          </div>
          <div style={styles.inputRow}>
            <span style={styles.inputLabel}>返し</span>
            <input style={styles.input} type="number" value={local.returnPoint} onChange={(e) => setLocal({ ...local, returnPoint: parseInt(e.target.value) || 0 })} />
          </div>
          <p style={{ fontSize: 12, color: "#64748b", margin: "0 0 0 0", lineHeight: 1.6 }}>
            オカ: {((local.returnPoint - local.startPoint) * 4 / 1000).toFixed(1)}pt（自動計算）
          </p>
        </div>
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>ウマ</h3>
          {["1着", "2着", "3着", "4着"].map((label, i) => (
            <div key={i} style={styles.inputRow}>
              <span style={styles.inputLabel}>{label}</span>
              <input style={styles.input} type="number" value={local.uma[i]} onChange={(e) => updateUma(i, e.target.value)} />
            </div>
          ))}
        </div>
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>チップ</h3>
          <div style={styles.inputRow}>
            <span style={styles.inputLabel}>配布枚数</span>
            <input style={styles.input} type="number" value={local.chipBase} onChange={(e) => setLocal({ ...local, chipBase: parseInt(e.target.value) || 0 })} />
          </div>
          <div style={styles.inputRow}>
            <span style={styles.inputLabel}>1枚あたりpt</span>
            <input style={styles.input} type="number" value={local.chipRate} onChange={(e) => setLocal({ ...local, chipRate: parseFloat(e.target.value) || 0 })} />
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Score Input Screen ──
function ScoreInputScreen({ settings, onSubmit, onBack, editData }) {
  const [scores, setScores] = useState(editData ? editData.scores : [25000, 25000, 25000, 25000]);
  const [inputs, setInputs] = useState(editData ? editData.scores.map(s => String(s / 100)) : ["250", "250", "250", "250"]);
  const [error, setError] = useState("");

  const parseInput = (v) => {
    if (v === "" || v === "-") return 0;
    return parseInt(v, 10) || 0;
  };

  const updateInput = (i, v) => {
    // 数字・マイナス記号のみ許可
    if (v !== "" && v !== "-" && !/^-?\d+$/.test(v)) return;
    // 先頭ゼロ除去（-0は許可、00xは防止）
    if (v.length > 1 && v[0] === "0") v = String(parseInt(v, 10) || 0);
    if (v.length > 2 && v.startsWith("-0") && v[2] !== undefined) v = "-" + String(parseInt(v.slice(1), 10) || 0);
    const inp = [...inputs]; inp[i] = v; setInputs(inp);
    const s = [...scores]; s[i] = parseInput(v) * 100; setScores(s); setError("");
  };
  const snapScore = (i) => { const s = [...scores]; s[i] = Math.round(s[i] / 100) * 100; setScores(s); };
  const autoCalc = (index) => {
    const expectedTotal = settings.startPoint * 4;
    const others = scores.reduce((sum, s, i) => (i !== index ? sum + s : sum), 0);
    const remain = expectedTotal - others;
    const s = [...scores]; s[index] = remain; setScores(s);
    const inp = [...inputs]; inp[index] = String(remain / 100); setInputs(inp);
    setError("");
  };

  const handleSubmit = () => {
    const total = scores.reduce((a, b) => a + b, 0);
    const expectedTotal = settings.startPoint * 4;
    if (total !== expectedTotal) { setError("合計が" + total.toLocaleString() + "点です（" + expectedTotal.toLocaleString() + "点にしてください）"); return; }
    onSubmit({ scores });
  };

  return (
    <div style={styles.screen}>
      <div style={styles.header}>
        <button style={styles.headerBtn} onClick={onBack}><Icon name="back" /></button>
        <h1 style={styles.headerTitle}>{editData ? "結果を編集" : "半荘結果入力"}</h1>
        <div style={{ width: 40 }} />
      </div>
      <div style={styles.content}>
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>持ち点</h3>
          {settings.players.map((p, i) => (
            <div key={i} style={styles.inputRow}>
              <span style={styles.inputLabel}>{p}</span>
              <input style={styles.input} type="text" inputMode="numeric" pattern="-?[0-9]*" value={inputs[i]} onChange={(e) => updateInput(i, e.target.value)} />
              <button style={styles.pmBtn} onClick={() => { const inp = [...inputs]; const s = [...scores]; const cur = parseInput(inp[i]); inp[i] = String(-cur); setInputs(inp); s[i] = -cur * 100; setScores(s); }}>±</button>
              <span style={{ fontSize: 13, color: "#64748b", flexShrink: 0 }}>00</span>
              <button style={styles.autoBtn} onClick={() => autoCalc(i)}>自動</button>
            </div>
          ))}
          {error && <p style={styles.error}>{error}</p>}
          <p style={styles.totalLine}>
            合計: <span style={{ color: scores.reduce((a, b) => a + b, 0) === settings.startPoint * 4 ? "#4ade80" : "#f87171", fontWeight: 700 }}>
              {scores.reduce((a, b) => a + b, 0).toLocaleString()}
            </span> / {(settings.startPoint * 4).toLocaleString()}
          </p>
          {scores.some(s => s !== roundScore(s)) && (
            <div style={{ marginTop: 10, padding: "8px 10px", borderRadius: 8, background: "rgba(255,255,255,0.03)", fontSize: 12, color: "#94a3b8", lineHeight: 1.8 }}>
              五捨六入: {settings.players.map((p, i) => (
                <span key={i}>{p} {scores[i].toLocaleString()}→<span style={{ color: "#e2e8f0", fontWeight: 600 }}>{roundScore(scores[i]).toLocaleString()}</span>{i < 3 ? "　" : ""}</span>
              ))}
            </div>
          )}
        </div>

        {(() => {
          const sorted = [...scores].sort((a, b) => b - a);
          const hasTie = sorted.some((s, i) => i > 0 && s === sorted[i - 1]);
          if (!hasTie) return null;
          return (
            <div style={{ ...styles.card, background: "rgba(251,191,36,0.08)", border: "1px solid rgba(251,191,36,0.2)" }}>
              <p style={{ margin: 0, fontSize: 12, color: "#fbbf24", lineHeight: 1.6 }}>
                ⚠ 同点のプレイヤーがいます。順位点は同点者間で平均して分配されます。
              </p>
            </div>
          );
        })()}

        <button style={styles.primaryBtn} onClick={handleSubmit}>
          {editData ? "更新する" : "記録する"}
        </button>
      </div>
    </div>
  );
}

// ── Chip Settlement Screen ──
function ChipScreen({ settings, chipRecords, onSave, onBack }) {
  const base = settings.chipBase;
  const [held, setHeld] = useState([base, base, base, base]);

  const updateHeld = (i, v) => { const h = [...held]; h[i] = parseInt(v) || 0; setHeld(h); };
  const heldSum = held.reduce((a, b) => a + b, 0);
  const expectedSum = base * 4;
  const diffs = held.map(h => h - base);

  const autoCalc = (index) => {
    const others = held.reduce((sum, h, i) => (i !== index ? sum + h : sum), 0);
    const h = [...held]; h[index] = expectedSum - others; setHeld(h);
  };

  const handleSubmit = () => {
    if (heldSum !== expectedSum) {
      if (!confirm("所持枚数の合計が" + heldSum + "枚です（配布合計" + expectedSum + "枚と一致しません）。記録しますか？")) return;
    }
    onSave([...diffs]);
    setHeld([base, base, base, base]);
  };

  const handleDeleteRecord = (idx) => {
    if (confirm("このチップ記録を削除しますか？")) {
      const updated = chipRecords.filter((_, i) => i !== idx);
      onSave(null, updated);
    }
  };

  const totals = [0, 0, 0, 0];
  chipRecords.forEach(r => r.forEach((v, i) => totals[i] += v));
  const ptTotals = totals.map(t => t * settings.chipRate);

  return (
    <div style={styles.screen}>
      <div style={styles.header}>
        <button style={styles.headerBtn} onClick={onBack}><Icon name="back" /></button>
        <h1 style={styles.headerTitle}>チップ精算</h1>
        <div style={{ width: 40 }} />
      </div>
      <div style={styles.content}>
        {chipRecords.length > 0 && (
          <div style={styles.card}>
            <h3 style={styles.cardTitle}>チップ累計</h3>
            {settings.players.map((p, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: i < 3 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                <span style={{ fontSize: 14, color: "#cbd5e1" }}>{p}</span>
                <div style={{ textAlign: "right" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: totals[i] >= 0 ? "#4ade80" : "#f87171" }}>
                    {totals[i] > 0 ? "+" : ""}{totals[i]}枚
                  </span>
                  <span style={{ fontSize: 12, color: "#64748b", marginLeft: 8 }}>
                    ({ptTotals[i] >= 0 ? "+" : ""}{ptTotals[i].toFixed(1)}pt)
                  </span>
                </div>
              </div>
            ))}
          </div>
        )}

        <div style={styles.card}>
          <h3 style={styles.cardTitle}>所持チップ枚数を入力</h3>
          <p style={{ margin: "-4px 0 12px", fontSize: 12, color: "#64748b" }}>
            配布枚数: {base}枚 / 人（合計{expectedSum}枚）
          </p>
          {settings.players.map((p, i) => (
            <div key={i} style={styles.inputRow}>
              <span style={styles.inputLabel}>{p}</span>
              <input style={styles.input} type="number" value={held[i]} onChange={(e) => updateHeld(i, e.target.value)} />
              <button style={styles.autoBtn} onClick={() => autoCalc(i)}>自動</button>
            </div>
          ))}
          <p style={styles.totalLine}>
            合計: <span style={{ color: heldSum === expectedSum ? "#4ade80" : "#fbbf24", fontWeight: 700 }}>
              {heldSum}
            </span> / {expectedSum}枚
          </p>
        </div>

        {diffs.some(d => d !== 0) && (
          <div style={{ ...styles.card, background: "rgba(56,189,248,0.06)", border: "1px solid rgba(56,189,248,0.15)" }}>
            <h3 style={{ ...styles.cardTitle, color: "#38bdf8" }}>精算プレビュー</h3>
            {settings.players.map((p, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 13 }}>
                <span style={{ color: "#cbd5e1" }}>{p}</span>
                <span>
                  <span style={{ color: diffs[i] >= 0 ? "#4ade80" : "#f87171", fontWeight: 600 }}>
                    {diffs[i] > 0 ? "+" : ""}{diffs[i]}枚
                  </span>
                  <span style={{ color: "#64748b", marginLeft: 8 }}>
                    = {(diffs[i] * settings.chipRate) >= 0 ? "+" : ""}{(diffs[i] * settings.chipRate).toFixed(1)}pt
                  </span>
                </span>
              </div>
            ))}
          </div>
        )}

        <button style={styles.primaryBtn} onClick={handleSubmit}>チップを記録する</button>

        {chipRecords.length > 0 && (
          <div style={styles.card}>
            <h3 style={styles.cardTitle}>チップ記録履歴</h3>
            {chipRecords.map((rec, idx) => (
              <div key={idx} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: idx < chipRecords.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                <span style={{ fontSize: 12, color: "#64748b", minWidth: 28 }}>#{idx + 1}</span>
                <div style={{ flex: 1, display: "flex", gap: 8, flexWrap: "wrap", fontSize: 12 }}>
                  {settings.players.map((p, i) => (
                    <span key={i} style={{ color: rec[i] >= 0 ? "#4ade80" : "#f87171" }}>
                      {p.slice(0, 3)}:{rec[i] > 0 ? "+" : ""}{rec[i]}
                    </span>
                  ))}
                </div>
                <button style={{ ...styles.iconBtn, color: "#f87171" }} onClick={() => handleDeleteRecord(idx)}>
                  <Icon name="trash" size={14} />
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Summary Card ──
function SummaryView({ sessions, chipRecords, settings }) {
  if (sessions.length === 0 && chipRecords.length === 0) return null;

  const totals = [0, 0, 0, 0];
  sessions.forEach((s) => {
    const { results } = calcResult(s.scores, settings);
    results.forEach((r, i) => (totals[i] += r));
  });

  const chipTotals = [0, 0, 0, 0];
  chipRecords.forEach(r => r.forEach((v, i) => chipTotals[i] += v * settings.chipRate));

  const combined = totals.map((t, i) => t + chipTotals[i]);
  const sorted = combined.map((c, i) => ({ val: c, idx: i })).sort((a, b) => b.val - a.val);

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>
        通算成績{sessions.length > 0 && ("（" + sessions.length + "半荘）")}
      </h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {sorted.map(({ val, idx }, rank) => (
          <div key={idx} style={{
            display: "flex", alignItems: "center", padding: "10px 12px", borderRadius: 10,
            background: rank === 0 ? "linear-gradient(135deg, rgba(251,191,36,0.15), rgba(251,191,36,0.05))" : "rgba(255,255,255,0.03)",
            border: rank === 0 ? "1px solid rgba(251,191,36,0.3)" : "1px solid rgba(255,255,255,0.05)"
          }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: rank === 0 ? "#fbbf24" : "#94a3b8", width: 28 }}>{rank + 1}位</span>
            <span style={{ flex: 1, fontSize: 14, fontWeight: 600, color: "#e2e8f0" }}>{settings.players[idx]}</span>
            <div style={{ textAlign: "right" }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: val >= 0 ? "#4ade80" : "#f87171" }}>
                {val >= 0 ? "+" : ""}{val.toFixed(1)}
              </span>
              {chipTotals[idx] !== 0 && (
                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 1 }}>
                  本体 {totals[idx] >= 0 ? "+" : ""}{totals[idx].toFixed(1)} / チップ {chipTotals[idx] >= 0 ? "+" : ""}{chipTotals[idx].toFixed(1)}
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Session Row ──
function SessionRow({ session, index, settings, onDelete, onEdit }) {
  const { results, ranks } = calcResult(session.scores, settings);
  return (
    <div style={{ ...styles.card, padding: "12px 14px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#94a3b8" }}>#{index + 1}</span>
        <div style={{ display: "flex", gap: 4 }}>
          <button style={styles.iconBtn} onClick={onEdit}><Icon name="edit" size={15} /></button>
          <button style={{ ...styles.iconBtn, color: "#f87171" }} onClick={onDelete}><Icon name="trash" size={15} /></button>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
        {ranks.map((playerIdx, rank) => (
          <div key={playerIdx} style={{
            display: "flex", justifyContent: "space-between", padding: "5px 8px",
            borderRadius: 6, background: "rgba(255,255,255,0.03)", fontSize: 13,
          }}>
            <span style={{ color: "#94a3b8" }}>
              <span style={{ fontWeight: 700, color: rank === 0 ? "#fbbf24" : "#64748b", marginRight: 4 }}>{rank + 1}</span>
              {settings.players[playerIdx]}
            </span>
            <span style={{ fontWeight: 600, color: results[playerIdx] >= 0 ? "#4ade80" : "#f87171" }}>
              {results[playerIdx] >= 0 ? "+" : ""}{results[playerIdx].toFixed(1)}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Confirm Dialog ──
function ConfirmDialog({ message, onConfirm, onCancel }) {
  return (
    <div style={styles.overlay}>
      <div style={styles.dialog}>
        <p style={{ margin: "0 0 20px", fontSize: 14, lineHeight: 1.7, color: "#e2e8f0" }}>{message}</p>
        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ ...styles.dialogBtn, background: "rgba(255,255,255,0.08)", color: "#94a3b8" }} onClick={onCancel}>キャンセル</button>
          <button style={{ ...styles.dialogBtn, background: "#ef4444", color: "#fff" }} onClick={onConfirm}>クリアする</button>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──
function MahjongApp() {
  const [screen, setScreen] = useState("home");
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [sessions, setSessions] = useState([]);
  const [chipRecords, setChipRecords] = useState([]);
  const [editIndex, setEditIndex] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);

  useEffect(() => {
    const data = loadData();
    if (data) {
      if (data.settings) setSettings({ ...DEFAULT_SETTINGS, ...data.settings });
      if (data.sessions) setSessions(data.sessions);
      if (data.chipRecords) setChipRecords(data.chipRecords);
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (loaded) saveData({ settings, sessions, chipRecords });
  }, [settings, sessions, chipRecords, loaded]);

  const handleAddSession = (data) => {
    if (editIndex !== null) {
      const updated = [...sessions]; updated[editIndex] = data; setSessions(updated); setEditIndex(null);
    } else {
      setSessions([...sessions, data]);
    }
    setScreen("home");
  };

  const handleDeleteSession = (i) => setSessions(sessions.filter((_, idx) => idx !== i));
  const handleEditSession = (i) => { setEditIndex(i); setScreen("input"); };
  const handleSaveSettings = (s) => { setSettings(s); setScreen("home"); };

  const handleChipSave = (newChips, replacedRecords) => {
    if (replacedRecords) {
      setChipRecords(replacedRecords);
    } else if (newChips) {
      setChipRecords([...chipRecords, newChips]);
    }
  };

  const handleClearAll = () => {
    setSessions([]);
    setChipRecords([]);
    setConfirmClear(false);
  };

  if (!loaded) {
    return (
      <div style={{ ...styles.screen, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "#94a3b8", fontSize: 14 }}>読み込み中...</div>
      </div>
    );
  }

  if (screen === "settings") return <SettingsScreen settings={settings} onSave={handleSaveSettings} onBack={() => setScreen("home")} />;
  if (screen === "input") return <ScoreInputScreen settings={settings} onSubmit={handleAddSession} onBack={() => { setScreen("home"); setEditIndex(null); }} editData={editIndex !== null ? sessions[editIndex] : null} />;
  if (screen === "chips") return <ChipScreen settings={settings} chipRecords={chipRecords} onSave={handleChipSave} onBack={() => setScreen("home")} />;

  return (
    <div style={styles.screen}>
      <div style={styles.header}>
        <div style={{ width: 40 }} />
        <div style={{ textAlign: "center", lineHeight: 1.4 }}>
          <h1 style={{ fontSize: 15, fontWeight: 800, margin: 0, color: "#f1f5f9", letterSpacing: "0.03em" }}>🀄 ダンナの麻雀スコア集計</h1>
          <p style={{ fontSize: 10, margin: "2px 0 0", color: "#64748b", letterSpacing: "0.05em" }}>〜徹マンはほどほどにしろよ〜</p>
        </div>
        <button style={styles.headerBtn} onClick={() => setScreen("settings")}><Icon name="settings" /></button>
      </div>

      <div style={styles.content}>
        <SummaryView sessions={sessions} chipRecords={chipRecords} settings={settings} />

        <div style={{ display: "flex", gap: 10 }}>
          <button style={styles.actionBtn} onClick={() => setScreen("chips")}>
            <Icon name="chip" size={18} />
            <span>チップ精算</span>
            {chipRecords.length > 0 && <span style={styles.badge}>{chipRecords.length}</span>}
          </button>
          {(sessions.length > 0 || chipRecords.length > 0) && (
            <button style={{ ...styles.actionBtn, ...styles.dangerActionBtn }} onClick={() => setConfirmClear(true)}>
              <Icon name="clear" size={18} />
              <span>結果クリア</span>
            </button>
          )}
        </div>

        {sessions.length > 0 && (
          <div style={styles.card}>
            <h3 style={styles.cardTitle}>対局履歴</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sessions.map((s, i) => (
                <SessionRow key={i} session={s} index={i} settings={settings} onDelete={() => handleDeleteSession(i)} onEdit={() => handleEditSession(i)} />
              ))}
            </div>
          </div>
        )}

        {sessions.length === 0 && (
          <div style={{ textAlign: "center", padding: "48px 20px", color: "#64748b" }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🀄</div>
            <p style={{ fontSize: 15, fontWeight: 500, marginBottom: 4 }}>まだ対局がありません</p>
            <p style={{ fontSize: 13 }}>今日も負けたら記録しなさいよ？</p>
          </div>
        )}
      </div>

      <button style={styles.fab} onClick={() => setScreen("input")}>
        <Icon name="plus" size={24} />
        <span style={{ fontSize: 13, fontWeight: 600 }}>半荘を追加</span>
      </button>

      {confirmClear && (
        <ConfirmDialog
          message="すべての対局結果とチップ記録をクリアします。この操作は元に戻せません。よろしいですか？"
          onConfirm={handleClearAll}
          onCancel={() => setConfirmClear(false)}
        />
      )}
    </div>
  );
}

  error: { color: "#f87171", fontSize: 12, fontWeight: 600, margin: "4px 0 0 0" },
  totalLine: { fontSize: 13, color: "#94a3b8", margin: "4px 0 0 0", textAlign: "right" },
  iconBtn: { background: "none", border: "none", color: "#64748b", cursor: "pointer", padding: 4, borderRadius: 6, display: "flex", alignItems: "center" },
  fab: {
    position: "fixed", bottom: 28, left: "50%", transform: "translateX(-50%)",

    display: "flex", alignItems: "center", gap: 8,
    boxShadow: "0 4px 24px rgba(37,99,235,0.45), 0 0 0 1px rgba(59,130,246,0.3)", zIndex: 50,
  },
  actionBtn: {
    flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
    padding: "12px 16px", borderRadius: 12,
    background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)",
    color: "#cbd5e1", fontSize: 13, fontWeight: 600, cursor: "pointer", position: "relative",
  },
  dangerActionBtn: {
    border: "1px solid rgba(239,68,68,0.25)", color: "#f87171", background: "rgba(239,68,68,0.06)",
  },
  badge: {
    position: "absolute", top: -6, right: -6,
    background: "#2563eb", color: "#fff", fontSize: 10, fontWeight: 700,
    width: 18, height: 18, borderRadius: "50%",
    display: "flex", alignItems: "center", justifyContent: "center",
  },
  overlay: {
    position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", backdropFilter: "blur(4px)",
    display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20,
  },
  dialog: {
    background: "#1e293b", border: "1px solid rgba(255,255,255,0.1)",
    borderRadius: 16, padding: "24px", maxWidth: 340, width: "100%",
  },
  dialogBtn: {
    flex: 1, padding: "12px", border: "none", borderRadius: 10,
    fontSize: 14, fontWeight: 700, cursor: "pointer",
  },
};

ReactDOM.createRoot(document.getElementById("root")).render(<MahjongApp />);
</script>
